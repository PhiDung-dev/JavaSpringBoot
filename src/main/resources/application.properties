spring.application.name=JavaSpringBoot
spring.datasource.url=${DBMS_CONNECTION:jdbc:mysql://localhost:3306/mysql_database}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DBMS_USERNAME:root}
spring.datasource.password=${DBMS_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
jwt.secret-key=${SIGNERKEY_DEV:my-super-secret-key-that-should-be-at-least-64-bytes-long-for-hs512-security}
jwt.access-token-expiration=200
jwt.refresh-token-expiration=1200
# Google GenAI
# Gemini API Key
spring.ai.google.genai.api-key=${NEW_GEMINI_API_KEY}

# Model Gemini
# Kích ho?t provider Google GenAI cho Chat
spring.ai.model.chat=google-genai

# C?u hình API Key và Model chu?n c?a Spring AI
spring.ai.google.genai.chat.options.model=gemini-3.5-flash
spring.ai.google.genai.chat.temperature=0.3